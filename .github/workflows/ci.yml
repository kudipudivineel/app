name: CI - Tatkal Ready
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t tatkal-ready:${{ github.sha }} .
      - name: Verify application files
        run: |
          test -s app/index.html
          test -s app/app.js
          test -s app/styles.css
          grep -q 'server {' nginx/default.conf
